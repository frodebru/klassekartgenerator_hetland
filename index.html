<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klassekartgenerator Hetland v2.0</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
    color:#1f2937;
}

header{
    background:#1e40af;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.controls{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

textarea{
    width:100%;
    min-height:180px;
    padding:10px;
    margin-bottom:15px;
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    align-items:center;
}

label{
    font-weight:bold;
}

input{
    padding:8px;
    width:80px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    background:#1d4ed8;
}

.classroom-wrapper{
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.board{
    background:#166534;
    color:white;
    text-align:center;
    padding:20px;
    border-radius:10px;
    font-size:24px;
    margin-bottom:40px;
}

.classroom{
    display:grid;
    gap:30px;
    justify-content:center;
}

.seat{
    width:140px;
    min-height:80px;
    background:#dbeafe;
    border:2px solid #60a5fa;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:10px;
    cursor:move;
    font-weight:bold;
    transition:.2s;
}

.seat
